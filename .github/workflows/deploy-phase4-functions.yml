name: Deploy CyberTech 360 Phase 4 Edge Functions\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - main\n    paths:\n      - "supabase/functions/soc-automation/**"\n      - "supabase/functions/soc-ai-investigator/**"\n      - "supabase/functions/soc-automation-worker/**"\n      - "supabase/config.toml"\n      - "supabase/migrations/**"\n      - ".github/workflows/deploy-phase4-functions.yml"\n\npermissions:\n  contents: read\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n\n    env:\n      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}\n      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}\n\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n        with:\n          persist-credentials: false\n\n      - name: Setup Supabase CLI\n        uses: supabase/setup-cli@v1\n        with:\n          version: latest\n\n      - name: Deploy Phase 5/6 database migrations\n        run: |\n          supabase link --project-ref "$SUPABASE_PROJECT_ID"\n          supabase db push --yes\n\n      - name: Deploy SOC automation\n        run: |\n          supabase functions deploy soc-automation \\n            --project-ref "$SUPABASE_PROJECT_ID" \\n            --use-api\n\n      - name: Deploy SOC AI investigator\n        run: |\n          supabase functions deploy soc-ai-investigator \\n            --project-ref "$SUPABASE_PROJECT_ID" \\n            --use-api\n\n      - name: Deploy SOC automation worker\n        run: |\n          supabase functions deploy soc-automation-worker \\n            --project-ref "$SUPABASE_PROJECT_ID" \\n            --use-api\n